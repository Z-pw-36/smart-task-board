  function review(id){const t=task(id);if(!t)return notFound();const canReview=[t.creatorEmployeeNo,t.reviewerEmployeeNo].includes(state.currentUser);if(!canReview||t.status!=='待验收')return page(`${header('任务验收','权限校验',`/task/${id}`)}<div class="empty">当前身份或任务状态不可进行验收</div>`,'tasks');const cr=state.completionReviews.find(x=>x.taskId===id)||{completionNote:'承办人已完成全部节点并提交完成申请。',deliverableSummary:t.deliverable};return page(`${header('任务验收','创建人管理',`/task/${id}`)}<section class="card" style="text-align:center"><span class="badge orange">${h(t.status)}</span><h2>${h(t.taskName)}</h2><div class="timeline">${['已接受','执行中','已汇报','待验收','自动归档'].map((s,i)=>`<div class="time-step ${i<3?'done':i===3?'current':''}">${s}</div>`).join('')}</div></section><section class="card"><div class="section-title">最后一次进度汇报</div><div class="kv"><span>当前进度</span><b>${t.progressPercent}%</b></div><div class="kv"><span>阶段成果</span><b>${h(cr.completionNote)}</b></div><div class="kv"><span>交付物摘要</span><b>${h(cr.deliverableSummary)}</b></div><div class="kv"><span>卡点说明</span><b>${t.hasIssue?'已解决或已说明':'无卡点'}</b></div></section><section class="card"><div class="section-head"><div class="section-title">创建人操作</div><span class="subtle">任务未归档阶段可用</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px"><button class="btn danger" data-action="creator-withdraw" data-id="${id}">撤回任务</button><button class="btn secondary" data-action="reassign" data-id="${id}">更换承办人</button><button class="btn danger" data-action="cancel-task" data-id="${id}">取消任务</button></div></section><section class="card"><div class="section-title">通知预览</div><p class="subtle">任务状态变更将通知以下成员</p>${[['原承办人',t.mainAssigneeEmployeeNo],['新承办人',''],['协同人','E1004']].map(([r,u])=>`<div class="form-row"><span class="grow">${r}</span><b>${u?h(user(u).name):'待更换'}</b></div>`).join('')}</section><div class="action-bar"><button class="btn secondary flex" data-action="review-reject" data-id="${id}">退回修改</button><button class="btn prima   function profile(){const me=user(state.currentUser),mine=state.tasks.filter(t=>[t.creatorEmployeeNo,t.mainAssigneeEmployeeNo,t.reviewerEmployeeNo].includes(state.currentUser));return page(`${header('我的','个人与演示设置','/workbench')}<section class="card profile-head"><div class="avatar">${h(me.name.slice(-1))}</div><h2 style="margin:0">${h(me.name)}</h2><div class="subtle">${h(me.department)} · ${h(me.employeeNo)}</div><p>${badge(state.role==='executive'?'高管身份':'员工身份')}</p></section><section class="card"><div class="section-title" style="margin-bottom:10px">演示角色</div><div class="segmented"><button class="${state.role==='employee'?'active':''}" data-role="employee">员工</button><button class="${state.role==='executive'?'active':''}" data-role="executive">高管</button></div><p class="subtle">角色决定工作台内容与可访问的数据范围。</p></section><section class="card metric-grid"><div class="metric"><span class="subtle">参与任务</span><strong>${mine.length}</strong></div><div class="metric good"><span class="subtle">本周完成</span><strong>6</strong></div><div class="metric warn"><span class="subtle">待处理</span><strong>${mine.filter(t=>['待接受','待验收','受阻'].includes(t.status)).length}</strong></div></section><section class="card"><button class="menu-row" data-action="generic">${icon('user')}<span>个人资料</span>${icon('chevron')}</button><button class="menu-row" data-action="generic">${icon('bell')}<span>通知偏好</span>${icon('chevron')}</button><button class="menu-row" data-action="generic">${icon('task')}<span>任务数据说明</span>${icon('chevron')}</button><button class="menu-row" data-action="reset-data">${icon('reset')}<span>重置演示数据</span>${icon('chevron')}</button></section>`,'profile')}

  let detailScrollHandler=null;
  function setDetailTab(key){state.detailTab=key;document.querySelectorAll('[data-detail-anchor]').forEach(btn=>btn.classList.toggle('active',btn.dataset.detailAnchor===key))}
  function setupDetailScrollSpy(){if(detailScrollHandler)window.removeEventListener('scroll',detailScrollHandler);const nav=document.querySelector('.detail-tabs');if(!nav)return;const sections=[['overview','detail-top'],['people','detail-people'],['nodes','detail-nodes'],['progress','detail-progress'],['performance','detail-performance']].map(([key,id])=>[key,document.getElementById(id)]).filter(([,el])=>el);detailScrollHandler=()=>{const marker=(nav.getBoundingClientRect().bottom||90)+24;let active='overview';sections.forEach(([key,el])=>{if(el.getBoundingClientRect().top<=marker)active=key});if(innerHeight+scrollY>=document.documentElement.scrollHeight-8)active=sections.at(-1)?.[0]||active;setDetailTab(active)};window.addEventListener('scroll',detailScrollHandler,{passive:true});detailScrollHandler()}

  function closeOverlay(){overlayRoot.innerHTML=''}

  function workloadSheet(id){const u=user(id),w=state.workloadSnapshots.find(x=>x.employeeNo===id);showSheet(`${u.name} · 负荷构成`, `<div class="card metric-grid"><div class="metric"><span class="subtle">综合负荷</span><strong>${w.workloadScore}</strong></div><div class="metric"><span class="subtle">状态</span><strong style="font-size:17px">${u.workloadLevel}</strong></div><div class="metric"><span class="subtle">本周任务</span><strong>8</strong></div></div>${[['任务剩余工时压力',w.hoursPressure],['任务权重压力',w.weightPressure],['任务数量压力',w.countPressure],['突发任务压力',w.urgentPressure],['受阻/逾期压力',w.blockedOverduePressure]].map(([l,v])=>`<div class="pressure"><div class="pressure-head"><b>${l}</b><b>${v}</b></div><div class="progress"><i style="width:${v}%;background:${v>80?'var(--red)':v>65?'var(--orange)':'var(--blue)'}"></i></div></div>`).join('')}<p class="subtle">点击具体任务可继续下钻查看风险与资源诉求。</p>`)}

  function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const input=document.getElementById('ai-input'),btn=document.querySelector('[data-action=voice]');if(!SR){toast('当前浏览器不支持语音识别，请使用文字输入');input?.focus();return}const rec=new SR();rec.lang='zh-CN';rec.interimResults=true;rec.continuous=false;btn?.classList.add('listening');toast('正在聆听，请开始描述任务');rec.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;if(input)input.value=text};rec.onerror=()=>{toast('语音识别失败，已切换为文字输入');input?.focus()};rec.onend=()=>btn?.classList.remove('listening');try{rec.start()}catch(e){toast('语音服务暂不可用，请使用文字输入')}}
